version: '3'
services:
  web:
    image: safepassage_flask
    build: .
    env_file:
      - .env # This file is optional; defaults will be used if it does not exist
    ports:
      - "8302:8302"   # team port on the shared class server (must match Dockerfile + nginx)
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
