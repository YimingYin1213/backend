# Safe Passage Heals backend: nginx on the class server.
# Browser -> https://safepassage.opencodingsociety.com -> nginx -> Flask in Docker on localhost:8302
# CORS is handled by Flask (allowed_origins in __init__.py), so nginx does not add CORS headers.
server {
    listen 80;
    listen [::]:80;
    server_name safepassage.opencodingsociety.com;

    location / {
        proxy_pass http://localhost:8302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
